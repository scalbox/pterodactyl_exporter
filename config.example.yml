host:
host_port: # This is the port of the panel (optional)
port: 9531 # Standard exporter listening port
api_key: 
https: true
ignore_ssl: false
# Can be set to `admin-all` (return all servers), `owner` (only owned servers)
# or "" (only accessible servers, shown in your servers list)
server_list_type: owner
query_interval: 10
# Interval in seconds between each query to the Pterodactyl panel (default: 10)

# Optional server UUID filters (use full UUIDs from the Pterodactyl Client API).
# An empty include list monitors every accessible server, except excluded ones.
# When both lists contain the same UUID, exclude_servers takes precedence.
include_servers: []
exclude_servers: []

# Example: monitor only these two servers, except the second one.
# include_servers:
#   - "11111111-1111-4111-8111-111111111111" # Production server
#   - "22222222-2222-4222-8222-222222222222" # Testing server
# exclude_servers:
#   - "22222222-2222-4222-8222-222222222222" # Exclude testing
