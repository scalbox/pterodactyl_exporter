services:
  pterodactyl-exporter:
    # Versioned image published automatically by GitHub Actions.
    image: ghcr.io/scalbox/pterodactyl_exporter:1.0.11
    container_name: pterodactyl-exporter
    restart: unless-stopped
    # In config.yml, keep listen_address: 0.0.0.0 for Docker networking.
    # For host-local Prometheus, use "127.0.0.1:9531:9531" below.
    ports:
      - "9531:9531"
    volumes:
      - ../config.yml:/opt/pterodactyl_exporter/config/config.yml:ro
