name: Publish Docker image

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate stable release tag
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable version tag such as 1.0.9"
            exit 1
          fi

      - name: Checkout tagged source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image tags
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/scalbox/pterodactyl_exporter
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish tagged image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Manual runs validate the build without publishing an image.
          push: ${{ github.event_name == 'push' }}
          build-args: |
            PACKAGE_VERSION=${{ github.event_name == 'push' && github.ref_name || '0.0.0' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
