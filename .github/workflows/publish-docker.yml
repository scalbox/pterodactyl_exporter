name: Publish Docker and Python release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish or repair (leave empty for build validation)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate stable release tag
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable version tag such as 1.0.9"
            exit 1
          fi

      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image tags
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/scalbox/pterodactyl_exporter
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish tagged image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Manual runs validate the build without publishing an image.
          push: ${{ github.event_name == 'push' }}
          build-args: |
            PACKAGE_VERSION=${{ github.event_name == 'push' && github.ref_name || '0.0.0' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  python:
    name: Test and build Python distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tagged source with Git history
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0 # setuptools-scm reads the Git tag for the package version.

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: python -m pip install '.[test]'

      - name: Run regression tests
        run: python -m pytest

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Verify release package names
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          test -f "dist/pterodactyl_exporter-${RELEASE_VERSION}-py3-none-any.whl"
          test -f "dist/pterodactyl_exporter-${RELEASE_VERSION}.tar.gz"

      - name: Save Python distributions for the release job
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  grafana-plugin:
    name: Test, compile and package Grafana uptime panel
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tagged plugin source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: grafana-plugin/package-lock.json

      - name: Install plugin dependencies
        working-directory: grafana-plugin
        run: npm ci --no-audit --no-fund

      - name: Test and compile Grafana plugin
        working-directory: grafana-plugin
        env:
          PLUGIN_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag || '1.0.0' }}
        run: npm run check

      - name: Package compiled plugin with its plugin ID directory
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          test -s grafana-plugin/dist/module.js
          test -s grafana-plugin/dist/plugin.json
          jq -e --arg version "$RELEASE_VERSION" '.info.version == $version' grafana-plugin/dist/plugin.json
          mkdir -p release-package/scalbox-pterodactyl-uptime
          cp -a grafana-plugin/dist/. release-package/scalbox-pterodactyl-uptime/
          (cd release-package && zip -q -r "../scalbox-pterodactyl-uptime-${RELEASE_VERSION}.zip" scalbox-pterodactyl-uptime)
          unzip -t "scalbox-pterodactyl-uptime-${RELEASE_VERSION}.zip"

      - name: Save installable ZIP for the release job
        if: github.event_name == 'push' || inputs.release_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: grafana-plugin-release
          path: scalbox-pterodactyl-uptime-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [publish, python, grafana-plugin]
    if: github.event_name == 'push' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout annotated release tag and its history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}
          fetch-depth: 0 # gh --notes-from-tag needs the annotated tag locally.

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable version tag such as 1.0.10"
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}" || {
            echo "::error::Release tag $RELEASE_TAG was not found in the checkout"
            exit 1
          }

      - name: Download verified Python distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist

      - name: Download compiled Grafana plugin
        uses: actions/download-artifact@v7
        with:
          name: grafana-plugin-release
          path: dist

      - name: Create release with Python and Grafana assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/scalbox-pterodactyl-uptime-${RELEASE_TAG}.zip" --clobber
            echo "::notice::Release $RELEASE_TAG already exists; updated only the Grafana plugin asset."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "Pterodactyl Exporter $RELEASE_TAG" \
            --notes-from-tag \
            --latest

  update-readme:
    name: Synchronize installation examples
    needs: release
    if: github.event_name == 'push' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    concurrency:
      group: readme-install-version
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Update pinned pip, pipx and Docker Compose versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          latest_tag="$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)"
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "::notice::Skipping install examples update: latest release is $latest_tag."
            exit 0
          fi

          mapfile -t installed_tags < <(
            grep -oE 'git\+https://github\.com/scalbox/pterodactyl_exporter\.git@[0-9]+\.[0-9]+\.[0-9]+' README.md | sed -E 's/^.*@//'
          )
          if [[ "${#installed_tags[@]}" -ne 2 || "${installed_tags[0]}" != "${installed_tags[1]}" ]]; then
            echo "::error::Expected exactly two matching pinned Git installation versions in README.md."
            exit 1
          fi

          current_tag="${installed_tags[0]}"
          compose_file="docker/docker-compose.yml"
          compose_tag="$(sed -nE 's|^[[:space:]]*image:[[:space:]]*ghcr\.io/scalbox/pterodactyl_exporter:([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$|\1|p' "$compose_file")"
          if [[ ! "$compose_tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected exactly one stable versioned GHCR image in $compose_file."
            exit 1
          fi

          highest="$(printf "%s\n%s\n%s\n" "$current_tag" "$compose_tag" "$RELEASE_TAG" | sort -V | tail -n 1)"
          if [[ "$highest" != "$RELEASE_TAG" ]]; then
            echo "::notice::Keeping newer install example (README $current_tag, Compose $compose_tag; release $RELEASE_TAG)."
            exit 0
          fi

          sed -E -i "s|git\+https://github\.com/scalbox/pterodactyl_exporter\.git@[0-9]+\.[0-9]+\.[0-9]+|git+https://github.com/scalbox/pterodactyl_exporter.git@${RELEASE_TAG}|g" README.md
          sed -E -i "s|^([[:space:]]*image:[[:space:]]*ghcr\.io/scalbox/pterodactyl_exporter:)[0-9]+\.[0-9]+\.[0-9]+([[:space:]]*)$|\1${RELEASE_TAG}\2|" "$compose_file"
          sed -E -i 's|^([[:space:]]*)# Published automatically by GitHub Actions when the [0-9]+\.[0-9]+\.[0-9]+ tag is pushed\.$|\1# Versioned image published automatically by GitHub Actions.|' "$compose_file"

          if git diff --quiet -- README.md "$compose_file"; then
            echo "::notice::README.md and Docker Compose already point to $RELEASE_TAG."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md "$compose_file"
          git commit -m "docs(install): synchronize versioned examples to $RELEASE_TAG [skip ci]"
          git push origin HEAD:main
