name: Publish Docker and Python release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate stable release tag
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable version tag such as 1.0.9"
            exit 1
          fi

      - name: Checkout tagged source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image tags
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/scalbox/pterodactyl_exporter
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish tagged image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Manual runs validate the build without publishing an image.
          push: ${{ github.event_name == 'push' }}
          build-args: |
            PACKAGE_VERSION=${{ github.event_name == 'push' && github.ref_name || '0.0.0' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  python:
    name: Test and build Python distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tagged source with Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # setuptools-scm reads the Git tag for the package version.

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: python -m pip install '.[test]'

      - name: Run regression tests
        run: python -m pytest

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Verify release package names
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          test -f "dist/pterodactyl_exporter-${RELEASE_VERSION}-py3-none-any.whl"
          test -f "dist/pterodactyl_exporter-${RELEASE_VERSION}.tar.gz"

      - name: Save Python distributions for the release job
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [publish, python]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified Python distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist

      - name: Create release with Python assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "Pterodactyl Exporter $RELEASE_TAG" \
            --notes-from-tag \
            --latest

  update-readme:
    name: Update README install version
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: readme-install-version
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Update versioned pip and pipx commands
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          latest_tag="$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)"
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "::notice::Skipping README update: latest release is $latest_tag."
            exit 0
          fi

          mapfile -t installed_tags < <(
            grep -oE 'git\+https://github\.com/scalbox/pterodactyl_exporter\.git@[0-9]+\.[0-9]+\.[0-9]+' README.md | sed -E 's/^.*@//'
          )
          if [[ "${#installed_tags[@]}" -ne 2 || "${installed_tags[0]}" != "${installed_tags[1]}" ]]; then
            echo "::error::Expected exactly two matching pinned Git installation versions in README.md."
            exit 1
          fi

          current_tag="${installed_tags[0]}"
          highest="$(printf "%s\n%s\n" "$current_tag" "$RELEASE_TAG" | sort -V | tail -n 1)"
          if [[ "$highest" != "$RELEASE_TAG" ]]; then
            echo "::notice::Keeping newer README version $current_tag (release $RELEASE_TAG is older)."
            exit 0
          fi

          sed -E -i "s|git\+https://github\.com/scalbox/pterodactyl_exporter\.git@[0-9]+\.[0-9]+\.[0-9]+|git+https://github.com/scalbox/pterodactyl_exporter.git@${RELEASE_TAG}|g" README.md

          if git diff --quiet -- README.md; then
            echo "::notice::README.md already points to $RELEASE_TAG."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): update install version to $RELEASE_TAG [skip ci]"
          git push origin HEAD:main
